name: Forge 1.16.5 build
on:
  push:
    branches: [ 'port/forge-1.16.5' ]
  pull_request:
    branches: [ 'port/forge-1.16.5' ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew build compileIntegrationTestJava compileClientTestJava --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: rebornstorage-forge-1.16.5
          path: build/libs/*.jar
