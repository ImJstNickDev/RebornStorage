buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:5.1.77' }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java'

version = '1.16.5-0.1.3-experimental.3'
group = 'net.gigabit101.rebornstorage'
archivesBaseName = 'rebornstorage'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    benchmark {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
    integrationTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
    clientTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'official', version: '1.16.5'
    runs {
        client {
            workingDirectory project.file('run/client')
            mods {
                rebornstorage {
                    source sourceSets.main
                    if (project.hasProperty('clientTest')) source sourceSets.clientTest
                }
            }
        }
        server {
            workingDirectory project.file(project.hasProperty('benchmark') ? 'run/benchmark' : (project.hasProperty('integrationTest') ? 'run/integration' : 'run/server'))
            args '--nogui'
            property 'terminal.jline', 'false'
            property 'terminal.ansi', 'false'
            mods {
                rebornstorage {
                    source sourceSets.main
                    if (project.hasProperty('integrationTest')) source sourceSets.integrationTest
                    if (project.hasProperty('benchmark')) source sourceSets.benchmark
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven { url = 'https://maven.theillusivec4.top/' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.26'
    implementation fg.deobf('curse.maven:refined-storage-243076:3630064')
    runtimeOnly fg.deobf('curse.maven:extrastorage-410168:3631492')
    runtimeOnly fg.deobf('curse.maven:rsinfinitybooster-446870:3613350')
    compileOnly fg.deobf('top.theillusivec4.curios:curios-forge:1.16.5-4.0.8.2:api')
    runtimeOnly fg.deobf('top.theillusivec4.curios:curios-forge:1.16.5-4.0.8.2')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}

jar {
    manifest { attributes('Implementation-Version': project.version) }
    from('LICENSE')
    from('NOTICE-RS.md')
    finalizedBy('reobfJar')
}

tasks.withType(JavaExec).configureEach {
    maxHeapSize = '1536m'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }

    // Let the smoke-test runner own the game process and its exit status.
    if (name == 'runServer' || name == 'runClient') {
        doFirst {
            if (project.hasProperty('exportLaunch')) {
                def command = [javaLauncher.get().executablePath.asFile.absolutePath] +
                    allJvmArgs + ['-cp', classpath.asPath, mainClass.get()] + args
                def launch = [
                    command: command,
                    directory: workingDir.toString(),
                    environment: environment.findAll { k, v -> System.getenv(k) != v.toString() }
                ]
                file("build/${name}-launch.json").text = groovy.json.JsonOutput.toJson(launch)
                throw new org.gradle.api.tasks.StopExecutionException()
            }
        }
    }
}
